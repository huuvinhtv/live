name: Update M3U  Sports Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 tiếng
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      # QUAN TRỌNG: Đã đổi sang cài aiohttp thay vì requests
      run: pip install aiohttp
      
    - name: Run checker
      env:
        TV_M3U_SOURCE_URL: ${{ secrets.TV_M3U_SOURCE_URL }} # Link m3u gốc (nếu dùng)
      run: python sports.py # Thay bằng tên file .py của bạn
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Thêm tất cả các file .m3u vừa được tạo
        git add *.m3u
        
        # Chỉ commit nếu có thay đổi kênh (kênh chết/sống thay đổi), nếu y nguyên thì bỏ qua để không báo lỗi đỏ
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV channels via Async" && git push)
