name: Update M3U Playlist AE

on:
  schedule:
    # Chạy mỗi 6 tiếng một lần (giờ UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Quan trọng: Cho phép action ghi đè/commit file vào repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run playlist script
        run: python get-playlist-ae.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist_ae.m3u
          # Chỉ commit nếu có sự thay đổi nội dung file
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update playlist $(date)" && git push)
