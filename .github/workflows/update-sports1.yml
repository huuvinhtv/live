name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 tiếng (tùy bạn chỉnh)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install requests
      
    - name: Run checker
      env:
        TV_M3U_SOURCE_URL: ${{ secrets.TV_M3U_SOURCE_URL }} # Bỏ dòng này nếu bạn lấy link trực tiếp trong code
      run: python sports.py # Thay bằng tên file python của bạn
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Dùng *.m3u để quét tất cả file m3u vừa được tạo ra
        git add *.m3u
        
        # Lệnh thần thánh: Chỉ commit nếu có sự thay đổi, không có thay đổi thì bỏ qua không báo lỗi
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV channels" && git push)
